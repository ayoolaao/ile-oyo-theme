# Publishes a release when a v* tag is pushed (for example v0.2.0).
#
# 1. build: tests, then builds every release file once (scripts/release.mjs).
# 2. publish-vscode and publish-npm: publish those exact files with Trusted
#    Publishing (OpenID Connect). No tokens are stored in this repository.
#    npm is stage-only: the version waits on npmjs.com until a maintainer
#    approves it with 2FA (npm stage approve, or Staged Packages on the site).
# 3. github-release: creates the GitHub Release, only after both stores
#    succeed.
#
# The publish jobs use the "release" environment. Trusted Publishing policies
# on the Marketplace (publisher jazzykid) and npm (package ile-oyo-theme) name
# this repository, this file and that environment. See docs/architecture.md,
# "Releasing".
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      # Fails unless the tag is v<palette version>.
      - run: node scripts/release.mjs --tag "$GITHUB_REF_NAME"
      # Catches a bad package spec, or a version that's already on npm,
      # before anything is published. Keep the ./ prefix: without it npm
      # reads dist/<file> as a GitHub repo.
      - run: npm publish --dry-run ./dist/ile-oyo-theme-*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          retention-days: 30

  publish-vscode:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Installs the pinned vsce from the lockfile.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      # --skip-duplicate makes a rerun safe once this version is live.
      - run: npx vsce publish --oidc --skip-duplicate --packagePath ./dist/ile-oyo-theme-*.vsix

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm stage publish needs npm 11.15.0 or newer; pin a known version.
      - run: npm install -g npm@11.21.1 && npm --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      # Stages the version (trusted publishing adds provenance). It becomes
      # installable only after a maintainer approves it with 2FA.
      # Keep the ./ prefix: without it npm reads dist/<file> as a GitHub repo.
      - run: npm stage publish ./dist/ile-oyo-theme-*.tgz

  github-release:
    needs: [publish-vscode, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" --verify-tag
          --title "Ilé-Ọ̀yọ́ $TAG"
          --notes-file dist/release-notes.md
          dist/ile-oyo-theme-*.vsix dist/Ile-Oyo-*.itermcolors dist/Ile-Oyo-*.xccolortheme
