<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Noto+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Generated by scripts/preview.mjs. Do not edit the output; edit this template. */
:root {
  color-scheme: light;
  --page: #F9EFDA; --ink: #1A2444; --muted: #5F6A7B; --line: #D9C59B; --accent: #B72728;
  --font-display: "Source Serif 4", "Noto Serif", Georgia, serif;
  --font-body: "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --page: #12192F; --ink: #F4E6CE; --muted: #8B9EAC; --line: #2D3B62; --accent: #F26B59; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 400 15px/1.6 var(--font-body); padding: 0 max(16px, 3vw) 64px; }
.wrap { max-width: 1400px; margin: 0 auto; display: grid; gap: 40px; }

.loom { display: grid; grid-template-columns: repeat(auto-fill, minmax(28px, 1fr)); height: 48px; margin: 0 calc(-1 * max(16px, 3vw)); overflow: hidden; }
.loom span { display: block; height: 100%; }
header { display: grid; gap: 8px; padding-top: 8px; }
.eyebrow { font: 500 12px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font: 600 clamp(36px, 6vw, 56px)/1.05 var(--font-display); margin: 0; }
.meta { font: 400 13px/1.5 var(--font-mono); color: var(--muted); }

.variant-row { display: grid; gap: 12px; }
.variant-row > h2 { font: 600 30px/1.1 var(--font-display); margin: 0; }
.variant-row > h2 small { font: 400 15px/1 var(--font-body); color: var(--muted); margin-left: 8px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 16px; align-items: start; }

.panel { background: var(--v-bg); color: var(--v-fg); border-radius: 14px; padding: clamp(16px, 3vw, 28px); display: grid; gap: 22px; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.panel-head strong { font: 600 18px/1.2 var(--font-body); }
.panel-head span { font: 400 12px/1.2 var(--font-mono); color: var(--v-comment); }
.badge { font: 500 12px/1 var(--font-mono); padding: 4px 8px; border-radius: 999px; background: var(--v-raise); }
h3 { font: 500 11px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--v-comment); margin: 0 0 10px; }

.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.sw { display: grid; grid-template-rows: 44px auto; border-radius: 8px; overflow: hidden; background: var(--v-raise); }
.sw .chip { display: flex; align-items: flex-end; padding: 6px 8px; font: 600 17px/1 var(--font-display); }
.sw .info { padding: 6px 8px 8px; display: grid; gap: 1px; }
.sw .k { font: 600 12px/1.3 var(--font-body); }
.sw .hex { font: 400 11px/1.3 var(--font-mono); }
.sw .cr { font: 500 11px/1 var(--font-mono); font-variant-numeric: tabular-nums; margin-top: 3px; }

.sample { background: var(--v-darker); border-radius: 8px; overflow: hidden; }
.sample .bar { font: 500 11px/1 var(--font-body); color: var(--v-comment); padding: 8px 12px; background: var(--v-dark); }
pre { margin: 0; padding: 12px 14px; overflow-x: auto; font: 400 12.5px/1.65 var(--font-mono); background: var(--v-bg); }
.sel { background: var(--v-selection); }
.cursorline { background: var(--v-line); display: inline-block; min-width: 100%; }

.ansi { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.ansi div { aspect-ratio: 1.5; border-radius: 5px; display: flex; align-items: flex-end; padding: 3px 5px; font: 500 10px/1 var(--font-mono); }
.ansi-label { font: 400 11px/1 var(--font-body); color: var(--v-comment); margin: 8px 0 4px; }

section.diff { display: grid; gap: 12px; }
section.diff h2 { font: 600 28px/1.1 var(--font-display); margin: 0; }
section.diff p { margin: 0; color: var(--muted); max-width: 70ch; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
th { font: 500 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
td.mono { font: 400 13px/1 var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dot { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; box-shadow: inset 0 0 0 1px rgba(127,127,127,.4); }
.fail { color: var(--accent); font-weight: 600; }
.same { color: var(--muted); }
</style>
</head>
<body>
<div class="loom" id="loom" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1>Ilé-Ọ̀yọ́</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div id="variants" style="display:grid;gap:36px"></div>
  <section class="diff" id="diff-section" hidden>
    <h2>Token by token</h2>
    <p>Contrast is measured against each palette's own background for that variant. Values below 4.5:1 are marked.</p>
    <div class="table-wrap"><table id="diff"><thead></thead><tbody></tbody></table></div>
  </section>
</div>
<script>
const DATA = __DATA__;
const MIN = 4.5;
const ACCENTS = ["red", "orange", "yellow", "green", "cyan", "blue", "purple", "pink"];

function lum(hex) {
  return [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(c => c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4)
    .reduce((s, c, i) => s + c * [0.2126, 0.7152, 0.0722][i], 0);
}
function cr(a, b) { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); }
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const readableOn = (hex, p) => cr(p.fg, hex) > cr(p.bg, hex) ? p.fg : p.bg;

const palettes = DATA.palettes;
const compare = palettes.length > 1;
document.getElementById("eyebrow").textContent = compare ? `Comparison · ${palettes.map(p => p.label).join(" vs ")}` : `Preview · ${palettes[0].label}`;
document.getElementById("meta").textContent = palettes.map(p => p.source).join("  ·  ");

// Masthead: narrow woven strips in the current palette's ẹtù, sányán and àlàárì.
(() => {
  const cur = palettes[palettes.length - 1].variants;
  const a = cur.ale.palette, o = cur.osan.palette;
  const seq = [[a.bg, o.red], [o.bg, a.yellow], [o.red, a.bg], [a.bg, a.blue], [o.bg, o.orange], [o.red, a.yellow]];
  const loom = document.getElementById("loom");
  for (let i = 0; i < 70; i++) {
    const [base, thread] = seq[i % seq.length];
    const s = document.createElement("span");
    s.style.background = `linear-gradient(90deg, ${base} 0 42%, ${thread} 42% 58%, ${base} 58% 100%)`;
    loom.appendChild(s);
  }
})();

function code(p) {
  const t = (k, s) => `<span style="color:${p[k]}">${esc(s)}</span>`;
  return [
    t("comment", "// Weave one strip of aṣọ-òkè"),
    `${t("pink", "const")} ${t("fg", "STRIP_WIDTH")} ${t("pink", "=")} ${t("purple", "4")}; ${t("comment", "// inches")}`,
    `${t("pink", "export async function")} ${t("green", "weave")}${t("fg", "(")}${t("orange", "threads")}${t("fg", ", { ")}${t("orange", "pattern")} ${t("pink", "=")} ${t("yellow", '"ẹtù"')}${t("fg", " }) {")}`,
    `<span class="cursorline">  ${t("pink", "for")} ${t("fg", "(")}${t("pink", "const")} ${t("fg", "t")} ${t("pink", "of")} ${t("fg", "threads) {")}</span>`,
    `    ${t("pink", "if")} ${t("fg", "(!t.color)")} ${t("pink", "throw new")} ${t("cyan", "Error")}${t("fg", "(")}${t("yellow", '"missing thread"')}${t("fg", ");")}`,
    `    ${t("pink", "await")} ${t("fg", "t.")}${t("green", "pass")}${t("fg", "(STRIP_WIDTH")} ${t("pink", "*")} ${t("purple", "2")}${t("fg", ");")}`,
    `  ${t("fg", "}")}`,
    `  ${t("pink", "return")} ${t("fg", "{ pattern, ")}<span class="sel">${t("fg", "sewn")}</span>${t("fg", ":")} ${t("purple", "true")} ${t("fg", "};")}`,
    t("fg", "}"),
  ].join("\n");
}

// Plain terminal text uses the foreground color, as real terminals do; ANSI
// colors appear only where a program asks for them.
function terminal(v) {
  const c = i => v.ansi[`color${i}`];
  const t = (i, s) => `<span style="color:${c(i)}">${esc(s)}</span>`;
  const f = s => `<span style="color:${v.palette.fg}">${esc(s)}</span>`;
  return [
    `${t(2, "ayoola")}${t(8, "@")}${t(4, "iseyin")} ${t(6, "~/ile-oyo-theme")} ${t(5, "(develop)")} ${f("$ git status -s")}`,
    `${t(2, " M")} ${f("palette/ile-oyo.json")}`,
    `${t(1, " D")} ${f("palette/draft.json")}`,
    `${t(3, "??")} ${f("scripts/preview.mjs")}`,
    `${t(10, "✓")} ${f("check passed:")} ${t(13, "2")} ${f("variants")}  ${t(9, "✗")} ${t(11, "warning")}`,
    `${t(12, "notes/")}  ${t(12, "palette/")}  ${t(14, "README.md")}  ${f("package.json")}`,
  ].join("\n");
}

function panel(pal, id) {
  const v = pal.variants[id], p = v.palette, ui = v.ui || {};
  const el = document.createElement("div");
  el.className = "panel";
  const vars = {
    "--v-bg": p.bg, "--v-fg": p.fg, "--v-comment": p.comment, "--v-selection": p.selection,
    "--v-line": (v.other && v.other.line_highlight) || p.selection,
    "--v-raise": ui.bg_light || p.selection, "--v-dark": ui.bg_dark || p.bg, "--v-darker": ui.bg_darker || p.bg,
  };
  for (const [k, val] of Object.entries(vars)) el.style.setProperty(k, val);

  const texts = ["fg", "comment", ...ACCENTS];
  const failing = texts.filter(k => cr(p[k], p.bg) < MIN).length;
  const sw = k => {
    const hex = p[k], r = k === "bg" ? null : cr(hex, p.bg);
    const bad = r !== null && k !== "selection" && r < MIN;
    return `<div class="sw">
      <div class="chip" style="background:${hex};color:${readableOn(hex, p)}${k === "bg" ? `;box-shadow:inset 0 0 0 1px ${p.selection}` : ""}">Aa</div>
      <div class="info"><div class="k">${k}</div><div class="hex">${hex}</div>
      ${r === null ? "" : `<div class="cr" style="color:${bad ? p.red : p.comment}">${r.toFixed(2)}:1${bad ? " ✗" : ""}</div>`}</div></div>`;
  };
  const ansiRow = from => Array.from({ length: 8 }, (_, i) => {
    const hex = v.ansi[`color${from + i}`];
    return `<div style="background:${hex};color:${readableOn(hex, p)};box-shadow:inset 0 0 0 1px ${p.selection}" title="color${from + i} ${hex}">${from + i}</div>`;
  }).join("");

  el.innerHTML = `
    <div class="panel-head"><div><strong>${pal.label}</strong> <span>${v.name || id}</span></div>
      <span class="badge" style="color:${failing ? p.red : p.fg}">${failing ? `${failing} of ${texts.length} text colors below ${MIN}:1` : `all ${texts.length} text colors ≥ ${MIN}:1`}</span></div>
    <div><h3>Base</h3><div class="swatches">${["bg", "fg", "selection", "comment"].map(sw).join("")}</div></div>
    <div><h3>Accents</h3><div class="swatches">${ACCENTS.map(sw).join("")}</div></div>
    <div class="sample"><div class="bar">weave.js</div><pre>${code(p)}</pre></div>
    <div class="sample"><div class="bar">Terminal</div><pre>${terminal(v)}</pre></div>
    <div><h3>ANSI 0–15</h3><div class="ansi-label">Normal</div><div class="ansi">${ansiRow(0)}</div>
      <div class="ansi-label">Bright</div><div class="ansi">${ansiRow(8)}</div></div>`;
  return el;
}

const host = document.getElementById("variants");
const ref = palettes[palettes.length - 1].variants;
for (const id of Object.keys(ref)) {
  const row = document.createElement("section");
  row.className = "variant-row";
  row.innerHTML = `<h2>${ref[id].name}<small>${ref[id].meaning} · ${ref[id].mode}</small></h2><div class="cols"></div>`;
  const cols = row.querySelector(".cols");
  for (const pal of palettes) if (pal.variants[id]) cols.appendChild(panel(pal, id));
  host.appendChild(row);
}

if (compare) {
  document.getElementById("diff-section").hidden = false;
  const thead = document.querySelector("#diff thead"), tbody = document.querySelector("#diff tbody");
  thead.innerHTML = `<tr><th>Variant</th><th>Token</th>${palettes.map(p => `<th>${p.label}</th><th></th>`).join("")}</tr>`;
  for (const id of Object.keys(ref)) {
    for (const k of ["bg", "fg", "selection", "comment", ...ACCENTS]) {
      const cells = palettes.map(pal => {
        const p = pal.variants[id].palette, hex = p[k];
        const r = k === "bg" ? null : cr(hex, p.bg);
        const bad = r !== null && k !== "selection" && r < MIN;
        return `<td class="mono"><span class="dot" style="background:${hex}"></span>${hex}</td>
          <td class="mono ${bad ? "fail" : ""}">${r === null ? "" : r.toFixed(2)}</td>`;
      }).join("");
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${ref[id].name}</td><td>${k}</td>${cells}`;
      tbody.appendChild(tr);
    }
  }
}
</script>
</body>
</html>
