; Ilé-Ọ̀yọ́ Ọ̀sán (afternoon, light) for fast-syntax-highlighting.
; Generated from palette/ile-oyo.json (v0.1.3) by npm run build; don't edit by hand.
; https://github.com/ayoolaao/ile-oyo-theme
;
; Load once with: fast-theme /path/to/ile-oyo-osan.ini

[base]
default          = none
unknown-token    = #A52A2A,bold
commandseparator = #A12854
redirection      = #A12854
here-string-tri  = #A12854
here-string-text = #876002
here-string-var  = #8B4513
exec-descriptor  = #6B3A5A
comment          = #576788
correct-subtle   = #576788
incorrect-subtle = #A52A2A
subtle-separator = #576788
subtle-bg        = bg:#C7BAA3
secondary        = 
recursive-base   = none

[command-point]
reserved-word     = #A12854
subcommand        = #4B5320
alias             = #2A5B5C
suffix-alias      = #2A5B5C,underline
global-alias      = #2A5B5C
builtin           = #2A5B5C
function          = #4B5320
command           = #4B5320
precommand        = #4B5320,underline
hashed-command    = #4B5320
single-sq-bracket = #A12854
double-sq-bracket = #A12854
double-paren      = #A12854

[paths]
path          = underline
pathseparator = underline
path-to-dir   = underline
globbing      = #6B3A5A
globbing-ext  = #6B3A5A,bold

[brackets]
paired-bracket  = bg:#C7BAA3
bracket-level-1 = #2A5B5C,bold
bracket-level-2 = #6B3A5A,bold
bracket-level-3 = #8B4513,bold

[arguments]
single-hyphen-option   = #6B3A5A
double-hyphen-option   = #6B3A5A
back-quoted-argument   = none
single-quoted-argument = #876002
double-quoted-argument = #876002
dollar-quoted-argument = #876002
optarg-string          = #876002
optarg-number          = #6B3A5A

[in-string]
back-dollar-quoted-argument           = #A12854
back-or-dollar-double-quoted-argument = #8B4513

[other]
variable             = #8B4513
assign               = none
assign-array-bracket = #A12854
history-expansion    = #6B3A5A

[math]
mathvar = #8B4513
mathnum = #6B3A5A
matherr = #A52A2A

[for-loop]
forvar  = #8B4513
fornum  = #6B3A5A
foroper = #A12854
forsep  = #A12854

[case]
case-input       = #8B4513
case-parentheses = #A12854
case-condition   = bg:#C7BAA3
