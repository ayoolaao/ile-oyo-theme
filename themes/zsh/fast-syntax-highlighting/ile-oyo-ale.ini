; Ilé-Ọ̀yọ́ Alẹ́ (evening, dark) for fast-syntax-highlighting.
; Generated from palette/ile-oyo.json (v0.2.0) by npm run build; don't edit by hand.
; https://github.com/ayoolaao/ile-oyo-theme
;
; Load once with: fast-theme /path/to/ile-oyo-ale.ini

[base]
default          = none
unknown-token    = #EC6C64,bold
commandseparator = #E86A8F
redirection      = #E86A8F
here-string-tri  = #E86A8F
here-string-text = #DAA520
here-string-var  = #CE8154
exec-descriptor  = #BA83A5
comment          = #8994AA
correct-subtle   = #8994AA
incorrect-subtle = #EC6C64
subtle-separator = #8994AA
subtle-bg        = bg:#37496B
secondary        = 
recursive-base   = none

[command-point]
reserved-word     = #E86A8F
subcommand        = #8F9964
alias             = #6B9D9D
suffix-alias      = #6B9D9D,underline
global-alias      = #6B9D9D
builtin           = #6B9D9D
function          = #8F9964
command           = #8F9964
precommand        = #8F9964,underline
hashed-command    = #8F9964
single-sq-bracket = #E86A8F
double-sq-bracket = #E86A8F
double-paren      = #E86A8F

[paths]
path          = underline
pathseparator = underline
path-to-dir   = underline
globbing      = #BA83A5
globbing-ext  = #BA83A5,bold

[brackets]
paired-bracket  = bg:#37496B
bracket-level-1 = #6B9D9D,bold
bracket-level-2 = #BA83A5,bold
bracket-level-3 = #CE8154,bold

[arguments]
single-hyphen-option   = #BA83A5
double-hyphen-option   = #BA83A5
back-quoted-argument   = none
single-quoted-argument = #DAA520
double-quoted-argument = #DAA520
dollar-quoted-argument = #DAA520
optarg-string          = #DAA520
optarg-number          = #BA83A5

[in-string]
back-dollar-quoted-argument           = #E86A8F
back-or-dollar-double-quoted-argument = #CE8154

[other]
variable             = #CE8154
assign               = none
assign-array-bracket = #E86A8F
history-expansion    = #BA83A5

[math]
mathvar = #CE8154
mathnum = #BA83A5
matherr = #EC6C64

[for-loop]
forvar  = #CE8154
fornum  = #BA83A5
foroper = #E86A8F
forsep  = #E86A8F

[case]
case-input       = #CE8154
case-parentheses = #E86A8F
case-condition   = bg:#37496B
